name: Regenerate lockfile temporary

on:
  push:
    branches:
      - hostly/fix-firebase-admin-jose-runtime

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hostly/fix-firebase-admin-jose-runtime
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate package-lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remove temporary workflow and commit lockfile
        shell: bash
        run: |
          rm .github/workflows/regenerate-lockfile-temporary.yml
          git config user.name "hostly-cloud"
          git config user.email "fer@hostlyapp.app"
          git add package-lock.json .github/workflows/regenerate-lockfile-temporary.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync jose override lockfile"
          git push origin HEAD:hostly/fix-firebase-admin-jose-runtime
