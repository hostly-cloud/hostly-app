name: Security patch tenant root deletion

on:
  push:
    branches:
      - security/block-tenant-root-delete-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exactly one destructive tenant-root rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('firestore.rules')
          text = path.read_text(encoding='utf-8')
          old = '      allow delete: if sameRestaurant(restaurantId) && canManageSettings();'
          new = '      allow delete: if false;'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one tenant-root delete rule, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/security-patch-tenant-root.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules .github/workflows/security-patch-tenant-root.yml
          git diff --cached --check
          git commit -m "fix(security): block client tenant root deletion"
          git push
