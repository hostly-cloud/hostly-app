name: Catalog image live coverage - PR validation

on:
  pull_request:
    types: [synchronize]
    branches:
      - feat/catalog-product-image-matching

permissions:
  contents: read

concurrency:
  group: catalog-image-live-coverage-pr-validation
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.head_ref == 'test/catalog-image-live-coverage'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run one-time live coverage evaluation
        env:
          HOSTLY_OPENFOODFACTS_USER_AGENT: Hostly/1.0 (contact@hostlyapp.app)
        run: npm run eval:catalog-images:live -- --output-dir artifacts/catalog-image-live-eval

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-image-live-coverage-pr-${{ github.run_number }}
          path: artifacts/catalog-image-live-eval
          if-no-files-found: warn
          retention-days: 14
