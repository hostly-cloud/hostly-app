name: Menu import photo vision evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Evaluate photo corpus
        run: npm run eval:menu-import:photos

      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: menu-import-photo-vision-eval
          path: artifacts/menu-import-photo-vision-eval
          if-no-files-found: error
