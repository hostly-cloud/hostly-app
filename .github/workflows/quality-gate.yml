name: Hostly quality gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: hostly-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Hostly plan contract tests
        run: npx tsx --test tests/lib/hostly-plan.test.ts tests/lib/hostly-plan-catalog.test.ts tests/lib/hostly-entitlements.test.ts tests/lib/hostly-subscription-access.test.ts tests/lib/catalog-image-plan.test.ts tests/lib/catalog-image-subscription-ui.test.ts

      - name: Products control UX tests
        run: npx tsx --test tests/lib/product-ui-navigation.test.ts

      - name: TPV critical unit tests
        run: npm run test:tpv-unit

      - name: Catalog image Firestore race tests
        run: npm run test:catalog-images-server

      - name: Lint debt report
        continue-on-error: true
        run: npm run lint
