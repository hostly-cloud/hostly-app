name: Hostly quality gate
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
concurrency:
  group: hostly-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Setup Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Prepare i18n source snapshot
        run: tar -czf i18n-source-snapshot.tar.gz app components locales lib hooks context package.json tsconfig.json
      - name: Publish i18n source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: i18n-source-snapshot
          path: i18n-source-snapshot.tar.gz
          retention-days: 2
      - name: Hardcoded Spanish UI audit
        run: node scripts/audit-i18n-hardcoded.mjs
      - name: Publish i18n hardcoded audit
        uses: actions/upload-artifact@v4
        with:
          name: i18n-hardcoded-audit
          path: i18n-hardcoded-audit.json
          retention-days: 14
      - name: Locale catalog coverage audit
        run: node scripts/audit-i18n-catalog-coverage.mjs
      - name: Publish locale catalog coverage
        uses: actions/upload-artifact@v4
        with:
          name: i18n-catalog-coverage
          path: i18n-catalog-coverage.json
          retention-days: 14
      - name: Locale overlay integrity audit
        run: node scripts/audit-i18n-overlay-integrity.mjs
      - name: Dependency security audit
        run: npm audit
      - name: Firebase CLI stream-json security compatibility tests
        run: node --test tests/security/stream-json-compat.test.mjs
      - name: Storage product image RBAC contract
        run: node --test tests/security/storage-product-image-rbac-contract.test.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Hostly plan contract tests
        run: npx tsx --test tests/lib/hostly-plan.test.ts tests/lib/hostly-plan-catalog.test.ts tests/lib/hostly-entitlements.test.ts tests/lib/hostly-subscription-access.test.ts tests/lib/hostly-commercial-policy.test.ts tests/lib/hostly-commercial-proposal.test.ts tests/lib/catalog-image-plan.test.ts tests/lib/catalog-image-subscription-ui.test.ts
      - name: Production health contract tests
        run: npx tsx --test tests/lib/hostly-health.test.ts
      - name: Production security config tests
        run: node --test tests/config/next-security-headers.test.mjs
      - name: Public API surface audit
        run: node --test tests/security/public-api-surface.test.mjs
      - name: Disaster recovery security boundary
        run: node --test tests/security/disaster-recovery-boundary.test.mjs
      - name: Employee clocking QR security tests
        run: npx tsx --test tests/security/clocking-qr-route.test.ts
      - name: Marketing lead abuse protection tests
        run: npx tsx --test tests/lib/marketing-lead-abuse.test.ts
      - name: Operational RBAC tests
        run: |
          npx tsx --test tests/lib/operational-rbac.test.ts
          npx firebase emulators:exec --only firestore --project demo-hostly-operational-rbac "node --import tsx --test tests/server/operational-rbac-rules.test.ts"
      - name: Operational alert tests
        run: npx tsx --test tests/lib/operational-delay-alerts.test.ts tests/lib/operational-alert-policy.test.ts tests/lib/operational-notifications.test.ts
      - name: Cash close contract tests
        run: npx tsx --test tests/lib/cash-close-contract.test.ts
      - name: Products control UX tests
        run: npx tsx --test tests/lib/product-ui-navigation.test.ts tests/lib/product-row-hierarchy.test.ts tests/lib/product-modifier-kind.test.ts tests/lib/product-commercial-edit-intent.test.ts tests/lib/product-image-list-filter.test.ts tests/lib/catalog-image-bulk-readiness.test.ts
      - name: Reservations operational tests
        run: npx tsx --test tests/lib/reservation-operations.test.ts tests/lib/reservation-customer-history.test.ts
      - name: TPV critical unit tests
        run: npm run test:tpv-unit
      - name: Catalog image Firestore race tests
        run: npm run test:catalog-images-server
      - name: Interactive controls audit
        run: npm run audit:interactive-controls -- --json > interactive-controls-audit.json
      - name: Publish interactive controls audit
        uses: actions/upload-artifact@v4
        with:
          name: interactive-controls-audit
          path: interactive-controls-audit.json
          retention-days: 14
      - name: Lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint-report.txt
          status=${PIPESTATUS[0]}
          exit "$status"
      - name: Publish lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: lint-report.txt
          retention-days: 14
