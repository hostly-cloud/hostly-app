name: Menu import eval

on:
  pull_request:
    paths:
      - "app/api/menu-imports/**"
      - "app/api/catalog/generate-product-image/**"
      - "lib/server/menu-imports/**"
      - "lib/server/product-images/**"
      - "lib/menu-import-eval/**"
      - "lib/carta/extract-menu-from-upload.ts"
      - "lib/carta/request-menu-import-*.ts"
      - "lib/carta/product-image-enrichment.ts"
      - "lib/firestore/menu-import-drafts.ts"
      - "lib/storage/menu-import-files.ts"
      - "scripts/eval-menu-import-corpus.ts"
      - "tests/lib/menu-import-ai-restaurant-context.test.ts"
      - "tests/lib/menu-import-local-learning.test.ts"
      - "tests/lib/product-image-enrichment.test.ts"
      - "tests/lib/imported-product-image-generation.test.ts"
      - "tests/server/generate-imported-product-image-request.test.ts"
      - "test-corpus/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/menu-import-eval.yml"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run menu import corpus eval
        run: npm run eval:menu-import

      - name: Run restaurant context unit tests
        run: npx tsx --test tests/lib/menu-import-ai-restaurant-context.test.ts

      - name: Run local learning unit tests
        run: npx tsx --test tests/lib/menu-import-local-learning.test.ts

      - name: Run product image enrichment unit tests
        run: npx tsx --test tests/lib/product-image-enrichment.test.ts

      - name: Run imported product image generation unit tests
        run: npx tsx --test tests/lib/imported-product-image-generation.test.ts

      - name: Run product image generation request tests
        run: npx tsx --test tests/server/generate-imported-product-image-request.test.ts
