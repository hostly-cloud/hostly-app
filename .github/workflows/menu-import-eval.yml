name: Menu import eval

on:
  pull_request:
    paths:
      - "app/api/menu-imports/**"
      - "app/api/catalog/generate-product-image/**"
      - "app/api/catalog/product-image-state/**"
      - "app/api/catalog/review-product-image/**"
      - "app/api/catalog/search-product-images/**"
      - "app/api/catalog/attach-product-image/**"
      - "app/api/catalog/product-identity/**"
      - "components/carta/carta-import-premium-layout-batch.tsx"
      - "components/productos/product-ai-image-review-panel.tsx"
      - "components/productos/product-form-commercial-info-modal.tsx"
      - "components/productos/product-commercial-identity-panel.tsx"
      - "components/productos/product-barcode-scanner.tsx"
      - "components/productos/product-exact-catalog-image-suggestion.tsx"
      - "lib/server/menu-imports/**"
      - "lib/server/product-images/**"
      - "lib/productos/product-image-review-*.ts"
      - "lib/productos/catalog-product-image-*.ts"
      - "lib/productos/catalog-image-live-eval.ts"
      - "lib/productos/product-commercial-identity-*.ts"
      - "lib/productos/gtin.ts"
      - "lib/productos/gtin-index-audit.ts"
      - "lib/menu-import-eval/**"
      - "lib/carta/extract-menu-from-upload.ts"
      - "lib/carta/menu-import-client-batch.ts"
      - "lib/carta/menu-import-source-files.ts"
      - "lib/carta/request-menu-import-*.ts"
      - "lib/carta/product-image-enrichment.ts"
      - "lib/firestore/menu-import-drafts.ts"
      - "lib/storage/menu-import-files.ts"
      - "scripts/audit-product-gtin-index.ts"
      - "scripts/eval-menu-import-corpus.ts"
      - "scripts/eval-menu-import-photo-corpus.ts"
      - "scripts/eval-catalog-product-images-live.ts"
      - "tests/lib/gtin-index-audit.test.ts"
      - "tests/lib/menu-import-batch-selection.test.ts"
      - "tests/lib/menu-import-multi-source.test.ts"
      - "tests/lib/menu-import-multi-page-merge.test.ts"
      - "tests/lib/menu-import-ai-restaurant-context.test.ts"
      - "tests/lib/menu-import-local-learning.test.ts"
      - "tests/lib/menu-import-photo-vision-recovery.test.ts"
      - "tests/lib/menu-import-photo-vision-eval.test.ts"
      - "tests/lib/product-image-enrichment.test.ts"
      - "tests/lib/imported-product-image-generation.test.ts"
      - "tests/lib/product-image-review-state.test.ts"
      - "tests/lib/catalog-product-image-matching.test.ts"
      - "tests/lib/catalog-product-image-provenance.test.ts"
      - "tests/lib/catalog-product-image-exact-suggestion.test.ts"
      - "tests/lib/wine-catalog-identity.test.ts"
      - "tests/lib/catalog-image-live-eval.test.ts"
      - "tests/lib/product-commercial-identity.test.ts"
      - "tests/server/generate-imported-product-image-request.test.ts"
      - "tests/server/product-image-review-request.test.ts"
      - "tests/server/catalog-product-image-request.test.ts"
      - "tests/server/product-commercial-identity-request.test.ts"
      - "test-corpus/**"
      - ".env.example"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/menu-import-eval.yml"
      - ".github/workflows/menu-import-photo-vision-eval.yml"
      - ".github/workflows/catalog-image-live-eval.yml"

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run menu import corpus eval
        run: npm run eval:menu-import

      - name: Run restaurant context unit tests
        run: npx tsx --test tests/lib/menu-import-ai-restaurant-context.test.ts

      - name: Run local learning unit tests
        run: npx tsx --test tests/lib/menu-import-local-learning.test.ts

      - name: Run canonical multi-photo batch tests
        run: npx tsx --test tests/lib/menu-import-multi-source.test.ts tests/lib/menu-import-multi-page-merge.test.ts tests/lib/menu-import-batch-selection.test.ts

      - name: Run photo vision recovery tests
        run: npx tsx --test tests/lib/menu-import-photo-vision-recovery.test.ts

      - name: Run photo vision evaluation model tests
        run: npx tsx --test tests/lib/menu-import-photo-vision-eval.test.ts

      - name: Validate photo corpus runner
        run: npm run eval:menu-import:photos

      - name: Run GTIN index audit model tests
        run: npx tsx --test tests/lib/gtin-index-audit.test.ts

      - name: Run product image enrichment unit tests
        run: npx tsx --test tests/lib/product-image-enrichment.test.ts

      - name: Run imported product image generation unit tests
        run: npx tsx --test tests/lib/imported-product-image-generation.test.ts

      - name: Run product image generation request tests
        run: npx tsx --test tests/server/generate-imported-product-image-request.test.ts

      - name: Run product image review state tests
        run: npx tsx --test tests/lib/product-image-review-state.test.ts

      - name: Run product image review request tests
        run: npx tsx --test tests/server/product-image-review-request.test.ts

      - name: Run catalog product image matching tests
        run: npx tsx --test tests/lib/catalog-product-image-matching.test.ts

      - name: Run catalog product image provenance tests
        run: npx tsx --test tests/lib/catalog-product-image-provenance.test.ts

      - name: Run exact GTIN image suggestion tests
        run: npx tsx --test tests/lib/catalog-product-image-exact-suggestion.test.ts

      - name: Run strict wine identity tests
        run: npx tsx --test tests/lib/wine-catalog-identity.test.ts

      - name: Run catalog product image request tests
        run: npx tsx --test tests/server/catalog-product-image-request.test.ts

      - name: Run catalog image live evaluation model tests
        run: npx tsx --test tests/lib/catalog-image-live-eval.test.ts

      - name: Run product commercial identity tests
        run: npx tsx --test tests/lib/product-commercial-identity.test.ts

      - name: Run product commercial identity request tests
        run: npx tsx --test tests/server/product-commercial-identity-request.test.ts
