name: Menu import eval

on:
  pull_request:
    paths:
      - "app/api/menu-imports/**"
      - "lib/server/menu-imports/**"
      - "lib/menu-import-eval/**"
      - "lib/carta/extract-menu-from-upload.ts"
      - "lib/carta/request-menu-import-*.ts"
      - "lib/firestore/menu-import-drafts.ts"
      - "lib/storage/menu-import-files.ts"
      - "scripts/eval-menu-import-corpus.ts"
      - "tests/lib/menu-import-ai-restaurant-context.test.ts"
      - "tests/lib/menu-import-local-learning.test.ts"
      - "test-corpus/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/menu-import-eval.yml"

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Refresh lockfile for dependency upgrade
        if: github.head_ref == 'modernize/runtime-node24-security'
        run: npm install --package-lock-only

      - name: Commit lockfile refresh
        if: github.head_ref == 'modernize/runtime-node24-security'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): refresh lockfile for Firebase Admin v14"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run menu import corpus eval
        run: npm run eval:menu-import

      - name: Run restaurant context unit tests
        run: npx tsx --test tests/lib/menu-import-ai-restaurant-context.test.ts

      - name: Run local learning unit tests
        run: npx tsx --test tests/lib/menu-import-local-learning.test.ts
