name: One-shot minimal lint patch
on:
  push:
    branches:
      - fix/final-hardening-2026-09-05-v2
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-hardening-2026-09-05-v2
          fetch-depth: 0
      - name: Restore base formatting and apply minimal lint fixes
        run: |
          BASE=e877b324f1e217f9fc781e68bebba41d2bb7d181
          git show "$BASE:components/tpv/tpv-product-info-plan-guard.tsx" > components/tpv/tpv-product-info-plan-guard.tsx
          git show "$BASE:lib/carta/use-central-products-for-carta.ts" > lib/carta/use-central-products-for-carta.ts
          git show "$BASE:app/dashboard/empleados/rendimiento/page.tsx" > app/dashboard/empleados/rendimiento/page.tsx
          git show "$BASE:lib/server/sommelier/sommelier-pairing-engine.ts" > lib/server/sommelier/sommelier-pairing-engine.ts
          python - <<'PY'
          from pathlib import Path

          path = Path('components/tpv/tpv-product-info-plan-guard.tsx')
          text = path.read_text()
          text = text.replace(
              '  const productsRef = useRef<readonly Product[]>([]);\n  productsRef.current = catalog.products;\n\n  const [access, setAccess] = useState<TpvProductInfoAccess>(CLOSED_ACCESS);\n  const accessRef = useRef<TpvProductInfoAccess>(CLOSED_ACCESS);\n  accessRef.current = access;\n',
              '  const productsRef = useRef<readonly Product[]>([]);\n\n  const [access, setAccess] = useState<TpvProductInfoAccess>(CLOSED_ACCESS);\n  const accessRef = useRef<TpvProductInfoAccess>(CLOSED_ACCESS);\n',
          )
          marker = '  const suppressNextClickRef = useRef<HTMLButtonElement | null>(null);\n\n'
          insertion = '''  const suppressNextClickRef = useRef<HTMLButtonElement | null>(null);\n\n  useEffect(() => {\n    productsRef.current = catalog.products;\n  }, [catalog.products]);\n\n  useEffect(() => {\n    accessRef.current = access;\n  }, [access]);\n\n'''
          if marker not in text:
              raise SystemExit('TPV marker missing')
          text = text.replace(marker, insertion, 1)
          path.write_text(text)

          path = Path('lib/carta/use-central-products-for-carta.ts')
          text = path.read_text()
          old = '''    if (awaitingProfileTenant || !rid || !authReady || !isAuthReady() || !isFirebaseConfigured) {\n      setGastronomyById(new Map());\n      return;\n    }'''
          new = '''    if (awaitingProfileTenant || !rid || !authReady || !isAuthReady() || !isFirebaseConfigured) {\n      const resetTask = window.setTimeout(() => setGastronomyById(new Map()), 0);\n      return () => window.clearTimeout(resetTask);\n    }'''
          if old not in text:
              raise SystemExit('catalog reset target missing')
          path.write_text(text.replace(old, new, 1))

          path = Path('app/dashboard/empleados/rendimiento/page.tsx')
          text = path.read_text()
          old = '  const rows = snapshot?.rows ?? [];'
          new = '  const rows = useMemo(() => snapshot?.rows ?? [], [snapshot?.rows]);'
          if text.count(old) != 1:
              raise SystemExit('performance rows target missing')
          path.write_text(text.replace(old, new, 1))

          path = Path('lib/server/sommelier/sommelier-pairing-engine.ts')
          text = path.read_text()
          old = '  let wineProfiles: Record<string, SommelierWineProfile> = {};'
          new = '  const wineProfiles: Record<string, SommelierWineProfile> = {};'
          if text.count(old) != 1:
              raise SystemExit('sommelier target missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit minimal patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/tpv/tpv-product-info-plan-guard.tsx lib/carta/use-central-products-for-carta.ts app/dashboard/empleados/rendimiento/page.tsx lib/server/sommelier/sommelier-pairing-engine.ts
          git commit -m "fix(lint): apply minimal React and const corrections"
          git push origin HEAD:fix/final-hardening-2026-09-05-v2
