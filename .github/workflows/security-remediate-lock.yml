name: Security lockfile remediation

on:
  push:
    branches:
      - modernize/runtime-node24-security
    paths:
      - ".github/workflows/security-remediate-lock.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modernize/runtime-node24-security

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Apply non-breaking npm security fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Commit lockfile remediation
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): apply non-breaking security fixes"
          git push origin HEAD:modernize/runtime-node24-security
