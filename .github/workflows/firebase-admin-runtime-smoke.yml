name: Firebase Admin runtime smoke

on:
  push:
    branches:
      - hostly/fix-firebase-admin-jose-runtime

jobs:
  runtime-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Load Firebase Admin Auth from CommonJS
        run: node -e "require('firebase-admin/auth'); console.log('firebase-admin/auth runtime OK')"
      - name: Verify jwks-rsa jose resolution
        run: node -e "const p=require.resolve('jose/package.json',{paths:[require.resolve('jwks-rsa')]}); const v=require(p).version; console.log('jwks-rsa jose',v); if(v!=='4.15.9') process.exit(1)"
