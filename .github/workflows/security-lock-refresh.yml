name: Security lock refresh

on:
  push:
    branches:
      - fix/security-local-qr-dependency-audit

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/security-local-qr-dependency-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify no high or critical vulnerabilities remain
        run: npm audit --audit-level=high

      - name: Commit refreshed lock and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/security-lock-refresh.yml
          git commit -m "fix(security): lock patched fast-uri"
          git push origin HEAD:fix/security-local-qr-dependency-audit
