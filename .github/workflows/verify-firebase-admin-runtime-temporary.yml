name: Verify Firebase Admin runtime temporary

on:
  push:
    branches:
      - hostly/fix-firebase-admin-jose-runtime

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: hostly/fix-firebase-admin-jose-runtime
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install clean dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Firebase Admin Auth can load
        run: |
          node -e "const auth = require('firebase-admin/auth'); if (typeof auth.getAuth !== 'function') throw new Error('firebase-admin/auth did not load'); console.log('firebase-admin/auth runtime OK')"
          node -e "const pkg = require('./node_modules/jwks-rsa/node_modules/jose/package.json'); if (pkg.version !== '4.15.9') throw new Error('unexpected nested jose '+pkg.version); console.log('jwks-rsa nested jose', pkg.version)"

      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/verify-firebase-admin-runtime-temporary.yml
          git config user.name "hostly-cloud"
          git config user.email "fer@hostlyapp.app"
          git add .github/workflows/verify-firebase-admin-runtime-temporary.yml
          git commit -m "chore: remove Firebase Admin runtime verifier"
          git push origin HEAD:hostly/fix-firebase-admin-jose-runtime
