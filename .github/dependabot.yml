version: 2
updates:
  # Security-first policy: keep vulnerability remediation enabled without
  # automatically opening routine major/minor/patch version-update PRs.
  # GitHub documents open-pull-requests-limit: 0 as the way to disable
  # version updates while allowing Dependabot security updates to continue.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
